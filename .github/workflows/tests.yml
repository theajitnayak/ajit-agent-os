name: Offline tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python -m ajit_os examples/fictional-deals.json --format json
      - name: Inconsistent invoice is rejected even though every field is grounded
        shell: bash
        run: |
          if python -m ajit_os.documents examples/invoice.txt examples/invoice-proposal.json; then
            echo "Expected the gate to reject this invoice"; exit 1
          fi
      - name: Benchmark runs offline against every stand-in
        run: |
          python bench/run.py --stub strict
          python bench/run.py --stub greedy
          python bench/run.py --stub fabricating
